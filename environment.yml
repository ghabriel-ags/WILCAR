# =============================================================================
# Conda/Micromamba Environment - MSc Neural Networks Project
# =============================================================================
# Federal University of Bahia - MSc in Industrial Engineering
# Author: Ghabriel Anton Gomes de Sá
#
# Installation:
#   micromamba create -f environment.yml
#   micromamba activate mestrado_ghabriel_pei
#
# Update:
#   micromamba update -f environment.yml
#
# GPU support (after activation):
#   pip install torch
# =============================================================================

name: mestrado_ghabriel_pei

channels:
  - conda-forge
  - defaults

dependencies:
  # ---------------------------------------------
  # Core Python
  # ---------------------------------------------
  - python>=3.10,<3.13

  # ---------------------------------------------
  # Scientific Computing
  # ---------------------------------------------
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - statsmodels>=0.14

  # ---------------------------------------------
  # Machine Learning
  # ---------------------------------------------
  - scikit-learn>=1.3

  # ---------------------------------------------
  # Visualization
  # ---------------------------------------------
  - matplotlib>=3.7
  - seaborn>=0.12

  # ---------------------------------------------
  # Jupyter / Interactive
  # ---------------------------------------------
  - jupyter>=1.0
  - jupyterlab>=4.0
  - ipykernel>=6.0
  - ipywidgets>=8.0

  # ---------------------------------------------
  # Development Tools
  # ---------------------------------------------
  - pytest>=7.0
  - pytest-cov>=4.0

  # ---------------------------------------------
  # Package Management
  # ---------------------------------------------
  - pip

  # ---------------------------------------------
  # Pip dependencies
  # ---------------------------------------------
  - pip:
    - ruff>=0.1
    - pre-commit>=3.0